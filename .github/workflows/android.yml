name: Application Android

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Fichier Excel, pages imprimables, connexion et synchronisation
        run: node --test tests/xl.test.js tests/compte.test.js
      - name: Horaires des rappels
        run: |
          mkdir -p "$RUNNER_TEMP/classes"
          javac -encoding UTF-8 -d "$RUNNER_TEMP/classes" android/app/src/main/java/ci/compterendu/spirituel/Horaires.java tests/HorairesTest.java
          java -cp "$RUNNER_TEMP/classes" HorairesTest

  base:
    name: Règles d'accès de la base
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: essai
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: essai
    steps:
      - uses: actions/checkout@v4
      - name: Qui voit quoi (responsable, faiseur, disciple, autre assemblée)
        run: sh supabase/tests/lancer.sh

  navigateur:
    name: Parcours complet dans un navigateur
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: essai
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: essai
      IMAGES: captures
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installer le navigateur d'essai
        run: |
          npm install --no-save playwright@1.48.2
          npx playwright install --with-deps chromium
      - name: Inscription, assemblée, suivi des disciples, deux appareils, hors connexion
        run: sh tests/navigateur/lancer.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captures-ecran
          path: captures

  apk:
    name: Construire l'APK
    needs: [tests, base]
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Préparer la signature
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/cles.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/cles.jks" >> "$GITHUB_ENV"

      - name: Construire la version signée
        if: env.KEYSTORE_BASE64 != ''
        run: gradle -p android assembleRelease

      - name: Construire la version d'essai (sans clé de signature)
        if: env.KEYSTORE_BASE64 == ''
        run: gradle -p android assembleDebug

      - name: Rassembler l'APK
        run: |
          mkdir -p sortie
          cp android/app/build/outputs/apk/*/*.apk sortie/CompteRenduSpirituel.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CompteRenduSpirituel-apk
          path: sortie/CompteRenduSpirituel.apk

      - name: Publier la version
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: sortie/CompteRenduSpirituel.apk
          generate_release_notes: true
