plugins {
    id 'com.android.application'
}

// Signature : fournie par l'intégration continue (secrets GitHub). Sans elle, seule la version « debug » se construit.
def magasinCles = System.getenv('KEYSTORE_FILE')
def numeroVersion = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()

android {
    namespace 'ci.compterendu.spirituel'
    compileSdk 34

    defaultConfig {
        applicationId 'ci.compterendu.spirituel'
        minSdk 29
        targetSdk 34
        versionCode numeroVersion
        versionName "1.0.${numeroVersion}"
    }

    // L'interface (dossier web/ à la racine du dépôt) est la même pour le site et pour l'application.
    sourceSets {
        main {
            assets.srcDirs = ['../../web']
        }
    }

    signingConfigs {
        publication {
            if (magasinCles) {
                storeFile file(magasinCles)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (magasinCles) {
                signingConfig signingConfigs.publication
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}
